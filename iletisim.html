<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim - Goldenbee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="font-sans text-gray-800">

  <!-- Navbar -->
  <nav class="bg-green-700 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🐝</span>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Goldenbee</h1>
          <p class="text-xs text-green-200 -mt-1">The Art of Freshness</p>
        </div>
      </div>
      <div class="hidden md:flex gap-8 text-lg">
        <a href="index.html" class="hover:text-green-200 transition">Ana Sayfa</a>
        <a href="hakkimizda.html" class="hover:text-green-200 transition">Hakkımızda</a>
        <a href="urunler.html" class="hover:text-green-200 transition">Ürünlerimiz</a>
        <a href="ihracat.html" class="hover:text-green-200 transition">İhracat</a>
        <a href="iletisim.html" class="hover:text-green-200 transition">İletişim</a>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-6 py-16">
    <h1 class="text-5xl font-bold text-center mb-12 text-green-700">İletişime Geçin</h1>

    <div class="grid md:grid-cols-2 gap-12">
      <div>
        <h2 class="text-2xl font-semibold mb-6">Bize Ulaşın</h2>
        <div class="space-y-6">
          <p><i class="fa-solid fa-phone mr-3"></i> +90 ___ ___ __ __</p>
          <p><i class="fa-solid fa-envelope mr-3"></i> info@goldenbee.com.tr</p>
          <p><i class="fa-solid fa-location-dot mr-3"></i> Adresiniz, Şehir, Türkiye</p>
        </div>
      </div>

      <div>
        <form class="space-y-6">
          <input type="text" placeholder="Adınız Soyadınız" class="w-full p-4 border rounded-xl">
          <input type="email" placeholder="E-posta Adresiniz" class="w-full p-4 border rounded-xl">
          <textarea placeholder="Mesajınız..." rows="6" class="w-full p-4 border rounded-xl"></textarea>
          <button type="submit" class="bg-green-700 text-white px-10 py-4 rounded-xl text-lg w-full hover:bg-green-800 transition">
            Mesaj Gönder
          </button>
        </form>
      </div>
    </div>
  </div>

  <footer class="bg-green-900 text-white py-12 text-center">
    <p>&copy; 2026 Goldenbee İthalat İhracat San. Tic. Ltd. Şti. | Tüm Hakları Saklıdır</p>
  </footer>
</body>
</html>
